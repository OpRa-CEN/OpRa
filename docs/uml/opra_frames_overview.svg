<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200" role="img" aria-labelledby="title desc">
  <title id="title">UML class diagram for OpRa frame schemas</title>
  <desc id="desc">Overview of all frames in xsd/opra_framework/opra_frames with inheritance and composition.</desc>

  <defs>
    <style><![CDATA[
      .bg { fill:#ffffff; }
      .title { font: 700 26px Arial, sans-serif; fill:#111827; }
      .subtitle { font: 400 14px Arial, sans-serif; fill:#4b5563; }
      .class { fill:#f8fafc; stroke:#334155; stroke-width:1.5; }
      .head { fill:#e2e8f0; stroke:#334155; stroke-width:1.5; }
      .name { font:700 14px Arial, sans-serif; fill:#0f172a; }
      .st { font: italic 12px Arial, sans-serif; fill:#475569; }
      .txt { font: 12px Arial, sans-serif; fill:#111827; }
      .meta { font: 12px Arial, sans-serif; fill:#334155; }
      .edge { stroke:#334155; stroke-width:1.6; fill:none; }
      .edge2 { stroke:#64748b; stroke-width:1.4; fill:none; }
      .lbl { font: 12px Arial, sans-serif; fill:#1f2937; }
      .legend { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1; }
      .small { font: 11px Arial, sans-serif; fill:#334155; }
    ]]></style>

    <marker id="tri" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <polygon points="0 6, 12 0, 12 12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="diamond" markerWidth="14" markerHeight="10" refX="2" refY="5" orient="auto">
      <polygon points="2 5, 7 0, 12 5, 7 10" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1200"/>
  <text class="title" x="24" y="38">UML Class Diagram — OpRa Frames (xsd/opra_framework/opra_frames)</text>
  <text class="subtitle" x="24" y="60">Includes: common, composite, planned service, actual service, indicator, contextual indicator</text>

  <!-- External / shared base -->
  <g transform="translate(40,110)">
    <rect class="class" width="320" height="85" rx="8" ry="8"/>
    <rect class="head" width="320" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«netex element» abstract</text>
    <text class="name" x="10" y="48">netex:VersionFrame</text>
    <text class="meta" x="10" y="68">External base element</text>
  </g>

  <g transform="translate(40,225)">
    <rect class="class" width="320" height="88" rx="8" ry="8"/>
    <rect class="head" width="320" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«netex complexType»</text>
    <text class="name" x="10" y="48">netex:VersionFrame_VersionStructure</text>
    <text class="meta" x="10" y="70">External base structure</text>
  </g>

  <g transform="translate(40,340)">
    <rect class="class" width="320" height="88" rx="8" ry="8"/>
    <rect class="head" width="320" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«netex complexType»</text>
    <text class="name" x="10" y="48">netex:Common_VersionFrameStructure</text>
    <text class="meta" x="10" y="70">External frame structure base</text>
  </g>

  <!-- OpRa common frame -->
  <g transform="translate(430,110)">
    <rect class="class" width="360" height="95" rx="8" ry="8"/>
    <rect class="head" width="360" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:element» abstract</text>
    <text class="name" x="10" y="48">CommonFrame</text>
    <text class="meta" x="10" y="70">substitutionGroup = netex:VersionFrame</text>
  </g>

  <g transform="translate(430,235)">
    <rect class="class" width="360" height="95" rx="8" ry="8"/>
    <rect class="head" width="360" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:complexType» abstract</text>
    <text class="name" x="10" y="48">Common_VersionFrameStructure</text>
    <text class="meta" x="10" y="70">extends netex:VersionFrame_VersionStructure</text>
  </g>

  <!-- Composite frame -->
  <g transform="translate(860,90)">
    <rect class="class" width="430" height="145" rx="8" ry="8"/>
    <rect class="head" width="430" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:element» concrete</text>
    <text class="name" x="10" y="48">CompositeFrame</text>
    <text class="txt" x="10" y="72">id : netex:CompositeFrameIdType [0..1]</text>
    <text class="meta" x="10" y="94">substitutionGroup = netex:VersionFrame</text>
    <text class="meta" x="10" y="114">restriction base = netex:Composite_VersionFrameStructure</text>
    <text class="txt" x="10" y="134">contains CompositeVersionFrameGroup [1]</text>
  </g>

  <g transform="translate(860,265)">
    <rect class="class" width="430" height="115" rx="8" ry="8"/>
    <rect class="head" width="430" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:complexType»</text>
    <text class="name" x="10" y="48">Composite_VersionFrameStructure</text>
    <text class="meta" x="10" y="72">extends Common_VersionFrameStructure</text>
    <text class="txt" x="10" y="96">+ frames : netex:frames_RelStructure [0..1]</text>
  </g>

  <!-- Planned frame -->
  <g transform="translate(1325,90)">
    <rect class="class" width="520" height="162" rx="8" ry="8"/>
    <rect class="head" width="520" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:element» concrete</text>
    <text class="name" x="10" y="48">PlannedServiceFrame</text>
    <text class="txt" x="10" y="72">id : PlannedServiceFrameIdType [0..1]</text>
    <text class="meta" x="10" y="94">substitutionGroup = netex:CommonFrame</text>
    <text class="meta" x="10" y="114">restriction base = OpRa_PlannedService_VersionFrameStructure</text>
    <text class="txt" x="10" y="136">contains PlannedServiceFrameGroup [1]</text>
    <text class="txt" x="10" y="156">NetexUrl [0..1], NetexPayload [0..1]</text>
  </g>

  <g transform="translate(1325,282)">
    <rect class="class" width="520" height="115" rx="8" ry="8"/>
    <rect class="head" width="520" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:complexType»</text>
    <text class="name" x="10" y="48">OpRa_PlannedService_VersionFrameStructure</text>
    <text class="meta" x="10" y="72">extends netex:Common_VersionFrameStructure</text>
    <text class="txt" x="10" y="96">+ PlannedServiceFrameGroup [1]</text>
  </g>

  <!-- Actual frame -->
  <g transform="translate(860,445)">
    <rect class="class" width="430" height="150" rx="8" ry="8"/>
    <rect class="head" width="430" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:element» concrete</text>
    <text class="name" x="10" y="48">ActualServiceFrame</text>
    <text class="txt" x="10" y="72">id : ActualServiceFrameIdType [0..1]</text>
    <text class="meta" x="10" y="94">substitutionGroup = netex:CommonFrame</text>
    <text class="meta" x="10" y="114">restriction base = ActualService_VersionFrameStructure</text>
    <text class="txt" x="10" y="136">NetexPayload : netex:dataObjects_RelStructure [1]</text>
  </g>

  <g transform="translate(860,620)">
    <rect class="class" width="430" height="110" rx="8" ry="8"/>
    <rect class="head" width="430" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:complexType»</text>
    <text class="name" x="10" y="48">ActualService_VersionFrameStructure</text>
    <text class="meta" x="10" y="72">extends netex:Common_VersionFrameStructure</text>
    <text class="txt" x="10" y="94">+ ActualServiceFrameGroup [1]</text>
  </g>

  <!-- Indicator frame -->
  <g transform="translate(1325,445)">
    <rect class="class" width="520" height="176" rx="8" ry="8"/>
    <rect class="head" width="520" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:element» concrete</text>
    <text class="name" x="10" y="48">IndicatorFrame</text>
    <text class="txt" x="10" y="72">id : IndicatorFrameIdType [0..1]</text>
    <text class="meta" x="10" y="94">substitutionGroup = netex:CommonFrame</text>
    <text class="meta" x="10" y="114">restriction base = IndicatorVersionFrameStructure</text>
    <text class="txt" x="10" y="136">PreparednessLevel [0..1]</text>
    <text class="txt" x="10" y="156">indicatorLogEntries [0..1], indicators [0..1]</text>
  </g>

  <g transform="translate(1325,646)">
    <rect class="class" width="520" height="118" rx="8" ry="8"/>
    <rect class="head" width="520" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:complexType»</text>
    <text class="name" x="10" y="48">IndicatorVersionFrameStructure</text>
    <text class="meta" x="10" y="72">extends netex:Common_VersionFrameStructure</text>
    <text class="txt" x="10" y="96">+ IndicatorFrameGroup [1]</text>
  </g>

  <!-- Contextual indicator frame -->
  <g transform="translate(860,790)">
    <rect class="class" width="985" height="160" rx="8" ry="8"/>
    <rect class="head" width="985" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:element» concrete</text>
    <text class="name" x="10" y="48">ContextualIndicatorFrame</text>
    <text class="txt" x="10" y="72">id : ContextualIndicatorFrameIdType [0..1]</text>
    <text class="meta" x="10" y="94">substitutionGroup = netex:CommonFrame</text>
    <text class="meta" x="10" y="114">restriction base = ContextualIndicatorFrameStructure</text>
    <text class="txt" x="10" y="136">contains IndicatorContextGroup [1] and indicators:CtxIndicators_RelStructure [1]</text>
  </g>

  <g transform="translate(860,970)">
    <rect class="class" width="985" height="110" rx="8" ry="8"/>
    <rect class="head" width="985" height="26" rx="8" ry="8"/>
    <text class="st" x="10" y="18">«xsd:complexType»</text>
    <text class="name" x="10" y="48">ContextualIndicatorFrameStructure</text>
    <text class="meta" x="10" y="72">extends netex:Common_VersionFrameStructure</text>
    <text class="txt" x="10" y="94">+ IndicatorContextGroup [1] + ContextualIndicatorFrameGroup [1]</text>
  </g>

  <!-- Generalizations -->
  <path class="edge" d="M 430 150 L 360 150" marker-end="url(#tri)"/>
  <text class="lbl" x="372" y="140">generalization</text>

  <path class="edge" d="M 430 278 L 360 270" marker-end="url(#tri)"/>

  <path class="edge" d="M 860 320 L 790 282" marker-end="url(#tri)"/>
  <path class="edge" d="M 1325 340 L 360 384" marker-end="url(#tri)"/>
  <path class="edge" d="M 860 675 L 360 384" marker-end="url(#tri)"/>
  <path class="edge" d="M 1325 706 L 360 384" marker-end="url(#tri)"/>
  <path class="edge" d="M 860 1030 L 360 384" marker-end="url(#tri)"/>

  <!-- Element-to-structure typing (dashed with arrow) -->
  <path class="edge2" d="M 1075 235 L 1075 265" marker-end="url(#arr)"/>
  <path class="edge2" d="M 1585 252 L 1585 282" marker-end="url(#arr)"/>
  <path class="edge2" d="M 1075 595 L 1075 620" marker-end="url(#arr)"/>
  <path class="edge2" d="M 1585 621 L 1585 646" marker-end="url(#arr)"/>
  <path class="edge2" d="M 1352 950 L 1352 970" marker-end="url(#arr)"/>

  <!-- Composition markers from structures to owned content groups/elements -->
  <path class="edge2" d="M 1250 350 L 1320 350" marker-start="url(#diamond)" marker-end="url(#arr)"/>
  <text class="lbl" x="1265" y="340">frames [0..1]</text>

  <path class="edge2" d="M 1790 360 L 1850 360" marker-start="url(#diamond)" marker-end="url(#arr)"/>
  <text class="lbl" x="1675" y="350">NetexUrl [0..1], NetexPayload [0..1]</text>

  <path class="edge2" d="M 1250 680 L 1320 680" marker-start="url(#diamond)" marker-end="url(#arr)"/>
  <text class="lbl" x="1145" y="670">NetexPayload [1]</text>

  <path class="edge2" d="M 1790 705 L 1850 705" marker-start="url(#diamond)" marker-end="url(#arr)"/>
  <text class="lbl" x="1550" y="695">Preparedness + indicators/logEntries</text>

  <path class="edge2" d="M 1790 1025 L 1850 1025" marker-start="url(#diamond)" marker-end="url(#arr)"/>
  <text class="lbl" x="1490" y="1015">IndicatorContext + indicators [1]</text>

  <!-- Legend -->
  <g transform="translate(30,1030)">
    <rect class="legend" width="760" height="145" rx="7" ry="7"/>
    <text class="name" x="12" y="24">Legend (UML Notation)</text>
    <line class="edge" x1="12" y1="46" x2="62" y2="46" marker-end="url(#tri)"/>
    <text class="small" x="76" y="50">Generalization (inheritance / specialization)</text>
    <line class="edge2" x1="12" y1="70" x2="62" y2="70" marker-end="url(#arr)"/>
    <text class="small" x="76" y="74">Directed association / type usage</text>
    <line class="edge2" x1="12" y1="94" x2="62" y2="94" marker-start="url(#diamond)" marker-end="url(#arr)"/>
    <text class="small" x="76" y="98">Composition (whole-part ownership)</text>
    <text class="small" x="12" y="122">Multiplicities are shown in attributes/labels as [0..1], [1], [1..*].</text>
  </g>
</svg>
